name: Screenly Android verification

on:
  push:
    branches:
      - feat/screenly2-offline-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug APK and run JVM tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Save reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
